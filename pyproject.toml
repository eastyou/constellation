[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation"
version = "0.1.0"
description = "星座：星点连线图、星座信息与练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "astronomy", "constellation", "stars", "worksheet", "printable", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
constellation = "constellation.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/constellation"
Source = "https://github.com/eastyou/constellation"

[tool.setuptools]
packages = ["constellation"]
